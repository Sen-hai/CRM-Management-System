<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>首页</title>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <!-- 导入bootstrap依赖 -->
    <link rel="stylesheet" href="../static/css/bootstrap.min.css"/>

    <!-- 导入ECharts库 -->
    <script src="https://cdn.jsdelivr.net/npm/echarts@5"></script>
    <style>
        a:link{font-size: 25px;color: rgb(109,109,109);}
        a:visited{font-size: 20px;color: rgb(109,109,109);}
        a:hover{font-size: 25px;color: white;text-decoration: none}
    </style>
</head>
<body>
<div class="container" id="app" style="width: 100%">
    <div class="row">
        <!--显示导航-->
        <div class="col-md-3" style="background-color: rgb(0,21,41); width:13%; height: 1000px;">
            <div class="row">
                <div class="col-md-12"
                     style="background-color: rgb(0,40,77);text-align: center;height: 70px;line-height: 70px;font-size: 20px;color: white;font-weight: bold;">
                    CRM管理系统
                </div>
            </div>
            <div class="row">
                <div class="col-md-12" style="text-align: center; padding: 60px 0px 40px 0px;">
                    <a href="customer_management.html">客户信息管理</a>
                </div>
            </div>
            <div class="row">
                <div class="col-md-12" style="text-align: center;padding: 40px 0px 40px 0px;">
                    <a href="order_view.html">订单查看</a>
                </div>
            </div>
            <div class="row">
                <div class="col-md-12" style="text-align: center;padding: 40px 0px 40px 0px;">
                    <a href="churn_customer_management.html">流失客户管理</a>
                </div>
            </div>
            <div class="row">
                <div class="col-md-12" style="text-align: center;padding: 40px 0px 40px 0px;">
                    <a href="user_management.html">用户管理</a>
                </div>
            </div>

            <div class="row">
                <div class="col-md-12" style="text-align: center;padding: 40px 0px 40px 0px;">
                    <a href="service_management.html">服务管理</a>
                </div>
            </div>
            <div class="row">
                <div class="col-md-12" style="text-align: center;padding: 40px 0px 40px 0px;">
                    <a href="user_management.html">添加用户</a>
                </div>
            </div>
            <div class="row">
                <div class="col-md-12" style="text-align: center;padding: 40px 0px 40px 0px;">
                    <a href="login.html">退出登录</a>
                </div>
            </div>
        </div>
        <!--显示内容-->
        <div class="col-md-9" style="border: 1px solid rgb(128,128,128);width: 87%; height: 1000px;background-color: #d9edf7;">
            <!-- 显示提示内容 -->
            <div class="row" style="width:100%">
                <div class="col-md-12" style="margin-top:150px; text-align: center; height: 90px;width: 100%;  font-size: 60px;color: rgb(54,84,159);line-height: 90px;font-weight: bold;padding-left: 20px">
                     &nbsp;&nbsp;欢迎来到 CRM 管理系统
                    <div id="test" style="height: 130px;"></div>
                     &nbsp;&nbsp;客户数据一览表
                    <div id="chartContainer" style="height: 400px;"></div>
                </div>
            </div>
            <!-- 显示内容 -->
            <div class="row">
                <!-- <div class="col-md-12" style="background-color: rgb(240,242,245); height: 730px;padding: 20px"> -->
                <!-- <img src="./云1.jpg" class="img-responsive center-block"/> -->
            </div>
        </div>
        <!-- 显示图表 -->
    </div>
</div>
<script>
    // 获取元素
    setTimeout(function () {
        const myChart = echarts.init(document.getElementById('chartContainer'));

        // 指定图表的配置项和数据
        // 在setOption方法之外声明变量

        const xData = ['五个月前', '四个月前', '三个月前', '两个月前', '一个月前'];
        const yData = [76, 87, 51, 81, 23, 45, 33];


        // 定义图表选项
        const option = {
            backgroundColor: "#111c4e",
            color: ['#3398DB'],
            tooltip: {
                trigger: 'axis',
                axisPointer: {
                    type: 'line',
                    lineStyle: {
                        opacity: 0
                    }
                },
                formatter: function (prams) {
                    return "客户新增数：" + prams[0].data
                }
            },
            grid: {
                left: '0%',
                right: '0%',
                bottom: '5%',
                top: '7%',
                height: '85%',
                containLabel: true,
                z: 22
            },
            xAxis: [{
                type: 'category',
                gridIndex: 0,
                data: xData,
                axisTick: {
                    alignWithLabel: true
                },
                axisLine: {
                    lineStyle: {
                        color: '#0c3b71'
                    }
                },
                axisLabel: {
                    show: true,
                    color: 'rgb(170,170,170)',
                    fontSize: 16
                }
            }],
            yAxis: [{
                type: 'value',
                gridIndex: 0,
                splitLine: {
                    show: false
                },
                axisTick: {
                    show: false
                },
                axisLine: {
                    lineStyle: {
                        color: '#0c3b71'
                    }
                },
                axisLabel: {
                    color: 'rgb(170,170,170)',
                    formatter: '{value}'
                }
            },
                {
                    type: 'value',
                    gridIndex: 0,
                    splitNumber: 12,
                    splitLine: {
                        show: false
                    },
                    axisLine: {
                        show: false
                    },
                    axisTick: {
                        show: false
                    },
                    axisLabel: {
                        show: false
                    },
                    splitArea: {
                        show: true,
                        areaStyle: {
                            color: ['rgba(250,250,250,0.0)', 'rgba(250,250,250,0.05)']
                        }
                    }
                }
            ],
            series: [{
                name: '办理数',
                type: 'bar',
                barWidth: '30%',
                xAxisIndex: 0,
                yAxisIndex: 0,
                label: {
                    normal: {
                        show: true,
                        position: "top",
                        textStyle: {
                            color: "#ffc72b",
                            fontSize: 20
                        }
                    }
                },
                itemStyle: {
                    normal: {
                        color: new echarts.graphic.LinearGradient(
                            0, 0, 0, 1, [{
                                offset: 0,
                                color: '#00feff'
                            },
                                {
                                    offset: 0.5,
                                    color: '#027eff'
                                },
                                {
                                    offset: 1,
                                    color: '#0286ff'
                                }
                            ]
                        )
                    }
                },
                data: yData,
                zlevel: 11

            },
                {
                    name: '背景',
                    type: 'bar',
                    barWidth: '50%',
                    xAxisIndex: 0,
                    yAxisIndex: 1,
                    barGap: '-135%',
                    data: [100, 100, 100, 100, 100, 100, 100],
                    itemStyle: {
                        normal: {
                            color: 'rgba(255,255,255,0.1)'
                        }
                    },
                    zlevel: 9
                },
            ]
        };
        // 设置图表的选项
        myChart.setOption(option);
    }, 0);
</script>
</body>
</html>
